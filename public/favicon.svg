<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2330" />
      <stop offset="50%" stop-color="#2a3242" />
      <stop offset="100%" stop-color="#0f1218" />
    </linearGradient>

    <!-- Metallic A Gradient -->
    <linearGradient id="metalA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4dbe8" />
    </linearGradient>

    <!-- Spatial Orb Glow -->
    <radialGradient id="orbGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93aeff" />
      <stop offset="45%" stop-color="#3b5dff" />
      <stop offset="100%" stop-color="#1d3ecf" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="spatialShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#3b5dff" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Base Squircle with Shadow -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#auraBg)" filter="url(#spatialShadow)" />
  <!-- Inner Border Bevel -->
  <rect x="5" y="5" width="54" height="54" rx="15" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.2" fill="none" />
  
  <!-- Stylized Geometric 3D 'A' Letterform -->
  <path d="M32 15 L44 47 H36.8 L34.2 39.5 H29.8 L27.2 47 H20 L32 15 Z M32 24.5 L30.6 34.5 H33.4 L32 24.5 Z" fill="url(#metalA)" />
  
  <!-- Accent highlight core in 'A' crossbar -->
  <rect x="29" y="34.5" width="6" height="3" rx="1.5" fill="#3b5dff" opacity="0.9" />

  <!-- Signature Blue Spatial Beacon Orb (Top-Right) -->
  <circle cx="50" cy="14" r="5.5" fill="url(#orbGlow)" filter="url(#beaconGlow)" />
  <circle cx="50" cy="14" r="5.5" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.7" fill="none" />
  <circle cx="48.3" cy="12.3" r="1.5" fill="#ffffff" opacity="0.85" />
</svg>
